<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商家商品中心</title><style>body{font:15px system-ui;max-width:820px;margin:40px auto;padding:0 20px;color:#24382d}section{border:1px solid #dfe8d6;border-radius:10px;padding:20px;margin:18px 0}input,button{padding:9px;margin:5px 0}button{cursor:pointer}.hidden{display:none}#status{white-space:pre-wrap}</style></head><body><h1>商家商品中心</h1><section id="login"><h2>商家登录</h2><input id="user" placeholder="商家账号"><input id="pass" type="password" placeholder="密码"><button onclick="login()">登录</button></section><section id="workspace" class="hidden"><h2>批量导入商品</h2><p>CSV 必须包含 product_id, category, title, description；可选 attributes(JSON)。</p><input id="file" type="file" accept=".csv,.json"><button onclick="upload()">上传并提交审核</button><button onclick="loadProducts()">刷新我的商品</button><pre id="status"></pre><table><tbody id="rows"></tbody></table></section><script>const $=id=>document.getElementById(id);async function api(url,opt){const r=await fetch(url,{credentials:'same-origin',...opt});const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d}async function login(){try{const d=await api('/api/merchant/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})});$('login').classList.add('hidden');$('workspace').classList.remove('hidden');$('status').textContent='已登录：'+d.merchant_name;loadProducts()}catch(e){$('status').textContent=e.message}}async function upload(){const f=$('file').files[0];if(!f)return;$('status').textContent='导入中…';try{$('status').textContent=JSON.stringify(await api('/api/merchant/products/import',{method:'POST',body:(()=>{const x=new FormData();x.append('file',f);return x})()}),null,2);loadProducts()}catch(e){$('status').textContent=e.message}}async function loadProducts(){try{const rows=await api('/api/merchant/products');$('rows').innerHTML=rows.map(x=>`<tr><td>${x.product_id}</td><td>${x.title}</td><td>${x.status}</td></tr>`).join('')}catch(e){$('status').textContent=e.message}}</script></body></html>
