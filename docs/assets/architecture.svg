<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Product Copy Quality Agent architecture</title>
  <desc id="desc">Bilingual browser interfaces call a FastAPI service, which coordinates a MySQL catalog and durable worker, deterministic policy tools, Elasticsearch retrieval, and optional DeepSeek analysis.</desc>
  <defs>
    <style>
      .bg{fill:#f7f7f4}.box{fill:#fff;stroke:#cfd5cf;stroke-width:2}.primary{fill:#173b35;stroke:#173b35}.accent{fill:#e6f1ed;stroke:#8bb5a7}.model{fill:#f5eee5;stroke:#c7a77e}.text{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20332f}.white{fill:#fff}.muted{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#63736d}.line{stroke:#6f817a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6f817a"/></marker>
  </defs>
  <rect class="bg" width="1200" height="420" rx="24"/>
  <text x="50" y="48" class="text" font-size="24">Product Copy Quality Agent</text>
  <text x="50" y="74" class="muted">Bilingual review workflow with deterministic policy checks and optional model assistance</text>
  <rect class="primary" x="50" y="135" width="190" height="90" rx="14"/><text x="145" y="172" text-anchor="middle" class="text white">Browser UI</text><text x="145" y="198" text-anchor="middle" class="muted white">Workbench + Admin</text>
  <rect class="box" x="330" y="120" width="210" height="120" rx="14"/><text x="435" y="164" text-anchor="middle" class="text">FastAPI</text><text x="435" y="191" text-anchor="middle" class="muted">Validation · Auth · API</text><text x="435" y="212" text-anchor="middle" class="muted">CSRF · Reports</text>
  <rect class="accent" x="630" y="80" width="240" height="100" rx="14"/><text x="750" y="120" text-anchor="middle" class="text">Python Agent</text><text x="750" y="146" text-anchor="middle" class="muted">Orchestrator · Skills · Tools</text>
  <rect class="model" x="930" y="80" width="210" height="100" rx="14"/><text x="1035" y="120" text-anchor="middle" class="text">Optional DeepSeek</text><text x="1035" y="146" text-anchor="middle" class="muted">Semantic analysis only</text>
  <rect class="box" x="630" y="250" width="240" height="100" rx="14"/><text x="750" y="290" text-anchor="middle" class="text">MySQL 8</text><text x="750" y="316" text-anchor="middle" class="muted">Catalog · Reports · Jobs</text>
  <rect class="box" x="930" y="250" width="210" height="100" rx="14"/><text x="1035" y="290" text-anchor="middle" class="text">Elasticsearch</text><text x="1035" y="316" text-anchor="middle" class="muted">Keyword rule retrieval</text>
  <path class="line" d="M240 180H330"/><path class="line" d="M540 170H630"/><path class="line" d="M870 130H930"/><path class="line" d="M750 180V250"/><path class="line" d="M870 300H930"/><path class="line" d="M435 240V300H630"/>
  <text x="50" y="390" class="muted">Durable MySQL jobs are consumed by a separate worker; publication is human-approved and version-guarded.</text>
</svg>
