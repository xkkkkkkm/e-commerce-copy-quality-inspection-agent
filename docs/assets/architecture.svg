<text x="72" y="204" font-size="13" fill="#627970">01 / INGRESS</text><text x="72" y="237" font-size="22" font-weight="700" fill="#163e36">Bilingual console + API</text><text x="72" y="268" font-size="14" fill="#627970">Sessions · CSRF · bounded submissions</text>
<rect x="430" y="170" width="325" height="133" rx="16" fill="#fff" stroke="#d5e2dc"/>
<text x="454" y="204" font-size="13" fill="#627970">02 / ISOLATION</text><text x="454" y="237" font-size="22" font-weight="700" fill="#163e36">MySQL per tenant</text><text x="454" y="268" font-size="14" fill="#627970">Private SQL users · durable item outbox</text>
<rect x="845" y="170" width="307" height="133" rx="16" fill="#fff" stroke="#d5e2dc"/>
<text x="869" y="204" font-size="13" fill="#627970">03 / DELIVERY</text><text x="869" y="237" font-size="22" font-weight="700" fill="#163e36">Redis Streams</text><text x="869" y="268" font-size="14" fill="#627970">Consumer groups · replay · backpressure</text>
<rect x="845" y="357" width="307" height="136" rx="16" fill="#175647"/>
<text x="869" y="391" font-size="13" fill="#b9d7c9">04 / CONCURRENT REVIEW</text><text x="869" y="424" font-size="22" font-weight="700" fill="#fff">DeepSeek-led Agent</text><text x="869" y="454" font-size="14" fill="#d1e6dc">Evidence validation → rule safeguards</text><text x="869" y="477" font-size="14" fill="#d1e6dc">Leases · rate limits · visible degradation</text>
<rect x="430" y="357" width="325" height="136" rx="16" fill="#fff" stroke="#d5e2dc"/>
<text x="454" y="391" font-size="13" fill="#627970">05 / DECISION</text><text x="454" y="424" font-size="22" font-weight="700" fill="#163e36">Human publication review</text><text x="454" y="454" font-size="14" fill="#627970">Current report · version checks · audit</text>
<rect x="48" y="357" width="292" height="136" rx="16" fill="#fff" stroke="#d5e2dc"/>
<text x="72" y="391" font-size="13" fill="#627970">06 / PROVENANCE</text><text x="72" y="424" font-size="22" font-weight="700" fill="#163e36">Reproducible data</text><text x="72" y="454" font-size="14" fill="#627970">10,000+ synthetic products</text><text x="72" y="477" font-size="14" fill="#627970">Separate evaluation gold and reports</text>
