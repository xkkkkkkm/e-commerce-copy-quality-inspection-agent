<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">E-commerce Copy Quality Inspection Agent</title>
<desc id="desc">Authenticated tenant ingress flows through private MySQL databases and Redis delivery to concurrent LLM-led inspections with mandatory rule safeguards, human publication review, audit trails and observability.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#75909b"/></marker></defs>
<rect width="1200" height="670" rx="24" fill="#f3f6f5"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="52" font-size="12" letter-spacing="3" fill="#4b746b">LLM-LED · TENANT ISOLATED · AUDITABLE</text>
<text x="48" y="96" font-size="31" font-weight="700" fill="#163e36">E-commerce Copy Quality Inspection Agent</text>
<text x="48" y="126" font-size="16" fill="#627970">From merchant copy to evidence-backed review and publication.</text>
<g stroke="#75909b" stroke-width="2" fill="none" marker-end="url(#arrow)">
